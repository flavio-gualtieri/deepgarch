[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepgarch"
version = "0.1.0"
description = "Neural network-parameterized GARCH volatility models"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Flavio Gualtieri" }]
dependencies = [
    "torch==2.10.0",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "yfinance==0.2.57",
    "matplotlib==3.10.9",
    "arch==8.0.0",
    "tqdm==4.68.1",
    "pyyaml==6.0.3",
    "pyarrow==24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]