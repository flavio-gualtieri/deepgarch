# Ablation: level head disabled (v_raw pinned to 0, so sigma_bar2 is fixed
# at the training-set unconditional variance). Everything else identical to
# configs/natgas.yaml — isolates the effect of the conditional level head.

seed: 42

data:
  ticker: "NG=F"
  start: "2005-01-01"
  val_start: "2018-01-01"
  test_start: "2021-01-01"
  yahoo_aux_tickers:
    crude: "CL=F"
    heating_oil: "HO=F"
    gasoline: "RB=F"

features:
  return_windows: [5, 10, 21, 63]
  exogenous_lag: 1
  include_seasonality: true

model:
  hidden_dims: [64, 32]
  dropout: 0.10
  p: 1
  q: 1
  rho_init: 4.95
  phi_init: -1.15
  constraint: stationary
  max_persistence: 0.995
  s_max: 0.25
  v_max: 1.0
  ablate_level_head: true

train:
  max_epochs: 1000
  learning_rate: 0.002
  weight_decay: 0.0001
  patience: 100
  min_delta: 0.0001
  grad_clip: 1.0
  log_every: 25

forecast:
  horizon: 30

output:
  market: nat_gas-ablate
  dir: results/ablations/natgas_ablate
