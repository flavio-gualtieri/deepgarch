# WTI crude (CL=F), with the natural-gas complex as cross-market auxiliary
# features. Event dates are used to annotate plots, sourced from Wikipedia
# ("Economic impact of the 2026 Iran war", "2026 Strait of Hormuz crisis")
# and CNBC / Al Jazeera reporting, July 2026.
#
# No `end`: the test window runs to the latest available bar, matching
# configs/spy.yaml and configs/natgas.yaml.

seed: 42

data:
  ticker: "CL=F"
  start: "2005-01-01"
  val_start: "2023-01-01"
  test_start: "2025-10-01"
  yahoo_aux_tickers:
    natural_gas: "NG=F"
    heating_oil: "HO=F"
    gasoline: "RB=F"

features:
  return_windows: [5, 10, 21, 63]
  exogenous_lag: 1
  include_seasonality: true

model:
  hidden_dims: [64, 32]
  dropout: 0.10
  p: 1
  q: 1
  rho_init: 4.95
  phi_init: -1.15
  constraint: stationary
  max_persistence: 0.995
  s_max: 0.25
  v_max: 1.0

train:
  max_epochs: 1000
  learning_rate: 0.002
  weight_decay: 0.0001
  patience: 100
  min_delta: 0.0001
  grad_clip: 1.0
  log_every: 25

forecast:
  horizon: 30

output:
  market: oil
  dir: results/oil
  regime_split: "2026-02-28"
  events:
    "US-Israel strikes begin": "2026-02-28"
    "Hormuz closure announced": "2026-03-04"
    "WTI peak (~$112)": "2026-04-06"
    "Islamabad Memorandum": "2026-06-17"
    "Iran re-closes Hormuz": "2026-06-20"
    "US strikes air defenses": "2026-07-12"
